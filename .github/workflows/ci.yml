name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: tests (Rust 1.98.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pin from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2
        with:
          # The Bevy client is a separate workspace with its own Cargo.lock.
          workspaces: |
            . -> target
            crates/shinobi-game -> target

      - name: System deps (Bevy audio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Workspace tests
        run: cargo test --workspace

      - name: Game crate tests (Bevy, detached workspace)
        run: cargo test
        working-directory: crates/shinobi-game
