[package]
name = "shinobi-game"
description = "Playable Bevy client. Detached from the main workspace (own Cargo.lock) so render deps never reach the server or the test loop."
version = "0.1.0"
edition = "2021"
publish = false

# empty table = its own workspace root
[workspace]

[dependencies]
shinobi-proto = { path = "../shinobi-proto" }
shinobi-sim = { path = "../shinobi-sim" }
shinobi-client = { path = "../shinobi-client" }
# Audio is on by default (alsa dev headers needed on Linux); `--no-default-features --features wayland` builds silent.
bevy = { version = "=0.19.1", default-features = false, features = [
    "bevy_winit", "x11", "bevy_window", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_log", "multi_threaded",
    "bevy_post_process", # bloom
] }

# Ctrl+C / SIGTERM -> clean AppExit (see src/signal.rs)
ctrlc = { version = "3.5", features = ["termination"] }

# only to turn on winit's dlopen of libwayland (so no wayland dev headers are needed to build)
winit = { version = "0.30", default-features = false, features = ["wayland-dlopen"], optional = true }

[features]
default = ["wayland", "audio"]
# Procedural synth + music slot via bevy_audio (needs alsa headers on Linux). No asset files required. Opt out with --no-default-features.
audio = ["bevy/bevy_audio", "bevy/wav"]
# Controller support (bevy_gilrs; on Linux it needs libudev dev headers, absent on the CI box). The mapping itself
# (shinobi_client::gamepad) is always compiled; without this feature no pad ever reports input.
gamepad = ["bevy/bevy_gilrs"]
# Native Wayland window (dlopen: no system headers needed). Without it the game runs through XWayland.
wayland = ["bevy/wayland", "dep:winit"]

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# Windows / macOS: controllers on by default (gilrs needs no system headers there)
[target.'cfg(not(target_os = "linux"))'.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["bevy_gilrs"] }
