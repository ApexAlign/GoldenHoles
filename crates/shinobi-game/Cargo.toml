[package]
name = "shinobi-game"
description = "Playable Bevy client. Detached from the main workspace (own Cargo.lock) so render deps never reach the server or the test loop."
version = "0.1.0"
edition = "2021"
publish = false

# empty table = its own workspace root
[workspace]

[dependencies]
shinobi-proto = { path = "../shinobi-proto" }
shinobi-sim = { path = "../shinobi-sim" }
shinobi-client = { path = "../shinobi-client" }
# Audio is opt-in (`--features audio`): alsa + libudev dev headers are not installed on this box.
bevy = { version = "=0.19.1", default-features = false, features = [
    "bevy_winit", "x11", "bevy_window", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_log", "multi_threaded",
    "bevy_post_process", # bloom
] }

# only to turn on winit's dlopen of libwayland (so no wayland dev headers are needed to build)
winit = { version = "0.30", default-features = false, features = ["wayland-dlopen"], optional = true }

[features]
default = ["wayland"]
# Procedural synth sound via bevy_audio (needs alsa headers on Linux). No asset files.
audio = ["bevy/bevy_audio", "bevy/wav"]
# Native Wayland window (dlopen: no system headers needed). Without it the game runs through XWayland.
wayland = ["bevy/wayland", "dep:winit"]

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
